<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="windowping">
  <title>windowping</title>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- 5-hour rolling arc -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#1e293b" stroke-width="4"/>
  <path d="M 32 13 A 19 19 0 1 1 14.3 39.1" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <!-- Clock hand + rollover pulse dot -->
  <path d="M 32 22 L 32 32 L 40 36" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="13" r="3.5" fill="#34d399"/>
</svg>
